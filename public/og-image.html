<!doctype html>
<!--
  Template Open Graph 1200×630 pour planfinancier.app.
  Comment générer le PNG :
    1. Ouvrir cette page en local : http://localhost:5173/og-image.html
       (avec npm run dev) OU en local : `open public/og-image.html`
    2. Chrome DevTools → ⋮ → More tools → Capture node screenshot
       (clic droit sur la <div class="og-frame"> → Capture node screenshot)
    3. Renommer en og-image.png et placer dans public/
    4. Référencer dans index.html (cf. docs/deploy-ovh.md §7)

  Alternative ligne de commande (1 commande) :
    npx playwright install chromium
    npx playwright codegen --viewport-size=1200,630 file://$(pwd)/public/og-image.html
    (puis screenshot)
-->
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Plan Financier — Open Graph</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      background: #444;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }
    .og-frame {
      width: 1200px;
      height: 630px;
      background:
        radial-gradient(circle at 85% 20%, rgba(196, 149, 106, 0.35) 0%, transparent 50%),
        radial-gradient(circle at 15% 90%, rgba(139, 108, 82, 0.25) 0%, transparent 50%),
        linear-gradient(135deg, #FDFAF6 0%, #F5EFE6 100%);
      padding: 90px 110px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      color: #3D2B1F;
      position: relative;
      overflow: hidden;
    }

    .og-header {
      display: flex;
      align-items: center;
      gap: 22px;
    }

    .og-mark {
      width: 84px;
      height: 84px;
      border-radius: 22px;
      background: #8B6C52;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 8px 32px rgba(61, 43, 31, 0.18);
    }

    .og-mark span {
      font-size: 38px;
      font-weight: 500;
      color: #FFF8F0;
      letter-spacing: -2px;
    }

    .og-brand {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .og-name {
      font-size: 36px;
      font-weight: 500;
      letter-spacing: -1px;
      color: #3D2B1F;
    }

    .og-tagline {
      font-size: 14px;
      color: #A08060;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      font-weight: 500;
    }

    .og-body {
      display: flex;
      flex-direction: column;
      gap: 28px;
      max-width: 820px;
    }

    .og-headline {
      font-size: 78px;
      font-weight: 600;
      line-height: 1.05;
      letter-spacing: -2.5px;
      color: #3D2B1F;
    }

    .og-headline em {
      font-style: normal;
      color: #8B6C52;
    }

    .og-subhead {
      font-size: 26px;
      line-height: 1.45;
      color: #5C3D1E;
      max-width: 750px;
      font-weight: 400;
    }

    .og-footer {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
    }

    .og-features {
      display: flex;
      gap: 14px;
      flex-wrap: wrap;
    }

    .og-pill {
      padding: 10px 20px;
      background: rgba(255, 255, 255, 0.55);
      border: 1px solid rgba(139, 108, 82, 0.25);
      border-radius: 999px;
      font-size: 15px;
      color: #5C3D1E;
      font-weight: 500;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      backdrop-filter: blur(8px);
    }

    .og-url {
      font-size: 18px;
      color: #A08060;
      font-weight: 500;
      letter-spacing: 0.04em;
    }
  </style>
</head>
<body>
  <div class="og-frame">
    <div class="og-header">
      <div class="og-mark"><span>FP</span></div>
      <div class="og-brand">
        <div class="og-name">Plan Financier</div>
        <div class="og-tagline">Votre budget, simplement</div>
      </div>
    </div>

    <div class="og-body">
      <div class="og-headline">
        Votre budget, <em>sans confier</em> vos données à personne.
      </div>
      <div class="og-subhead">
        Suivi des dépenses, comptes multiples, objectifs d'épargne et coaching IA — 100 % côté navigateur, hébergé en Europe.
      </div>
    </div>

    <div class="og-footer">
      <div class="og-features">
        <span class="og-pill">🔒 Données locales</span>
        <span class="og-pill">🇪🇺 Hébergé en UE</span>
        <span class="og-pill">✨ IA respectueuse</span>
      </div>
      <div class="og-url">planfinancier.app</div>
    </div>
  </div>
</body>
</html>
